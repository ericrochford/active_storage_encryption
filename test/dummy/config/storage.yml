development:
  public: true
  service: Disk
  root: <%= Rails.root.join("storage") %>

test:
  public: true
  service: Disk
  root: <%= Rails.root.join("storage") %>

encrypted_disk:
  service: EncryptedDisk
  root: <%= Rails.root.join("storage") %>
  private_url_policy: stream

encrypted_disk_mirror:
  service: EncryptedDisk
  root: <%= Rails.root.join("storage", "mirror") %>
  private_url_policy: stream

encrypted_mirror:
  service: EncryptedMirror
  primary: encrypted_disk
  mirrors:
    - encrypted_disk_mirror

encrypted_gcs_service:
  service: EncryptedGCS
